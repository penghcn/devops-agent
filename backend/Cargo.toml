[package]
name = "devops-agent"
version = "0.1.0"
edition = "2024"

[lib]
name = "devops_agent"
path = "src/lib.rs"

[[bin]]
name = "devops-agent"
path = "src/main.rs"

[dependencies]
yunli = { version ="0.1", features = ["config", "hash"] }        
axum = "0.8"          # Web 框架
tokio = { version = "1", features = ["full"] }  # 异步运行时
chrono = { version = "0.4", features = ["serde"] }  # 时间处理
async-trait = "0.1"  # dyn async trait support
serde = { version = "1", features = ["derive"] }  # 序列化
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }  # CORS + trace 支持
anyhow = "1"          # 错误处理
tracing = "0.1"       # 日志
tracing-subscriber = { version = "0.3", features = ["local-time", "time"] }
reqwest = { version = "0.12", features = ["json"] }  # HTTP 客户端
tokio-util = "0.7"    # 异步运行时工具
futures = "0.3"       # SSE 流式响应
tokio-stream = "0.1"  # SSE ReceiverStream
uuid = { version = "1", features = ["v4"] }  # Session IDs
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }  # SQLite + PostgreSQL
jsonwebtoken = "9"       # JWT 签发 + 验证
bcrypt = "0.16"          # 密码哈希
sha2 = "0.10"             # SHA256 指纹哈希
regex = "1"                # 指纹归一化正则

[target.'cfg(target_os = "linux")'.dependencies]
microsandbox = "0.4"       # 代码沙箱执行（仅 Linux，KVM 依赖在 macOS 不可用）

[dev-dependencies]
ctor = "0.2"
anyhow = "1"
tempfile = "3"
